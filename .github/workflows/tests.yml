name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: work/genesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: work/genesis/pyproject.toml
      - name: Установка пакета
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest
      - name: Проверка импорта установленного пакета
        run: python -c "import genesis, genesis.states, genesis.mclp, genesis.lscp, graphs, fire_units, lists"
      - name: Тесты
        run: python -m pytest -q tests
